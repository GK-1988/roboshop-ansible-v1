---
- name: configure dispatch server
  hosts: dispatch
  become: yes

  tasks:
    - name: install golang
      dnf:
        name: golang
        state: present

    - name: display go version
      command: go version
      register: go_default
    - debug:
        var: go_default.stdout


    - name: create golang system user
      user:
        name: roboshop
        system: true
        shell: /sbin/nologin  
        create_home: false
        home: /app
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove dispatch.zip
      file:
        path: /tmp/dipatch.zip
        state: absent

    - name:  create app directory
      file:
        path: /app
        state: directory

    - name: download dispatch artifact
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/dispatch-{{ app_version }}.zip
        dest: /tmp/dispatch.zip

    - name: unzip the payment receipe
      unarchive:
        src: /tmp/dispatch.zip
        dest: /app
        remote_src: yes

    - name: Build dispatch binary
      ansible.builtin.command:
        cmd: go build -o dispatch .
      args:
        chdir: /app
        creates: /app/dispatch

    - name: copy dispatch service file
      ansible.builtin.template:
        src: dispatch.service.j2
        dest: /etc/systemd/system/dispatch.service

    - name: start and enabled the dispatch
      systemd_service:
        name: dispatch
        state: restarted
        enabled: yes

        

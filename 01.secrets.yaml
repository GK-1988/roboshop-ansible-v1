---
- name: Query AWS Secrets Manager
  hosts: localhost
  gather_facts: no

  vars:
    # Name of the secret in AWS Secrets Manager
    secret_name: roboshop/dev/ansible

  tasks:
    - name: Retrieve secret value
      ansible.builtin.debug:
        msg: >
          {{ lookup('amazon.aws.aws_secret', 
                    secret_name, 
                    region='us-east-1') }}

- name: Retrieve and parse JSON secret
  hosts: localhost
  gather_facts: no

  vars:
    secret_name: roboshop/dev/ansible

  tasks:
    - name: Get secret as JSON
      set_fact:
        creds: "{{ lookup('amazon.aws.aws_secret',
                              secret_name,
                              region='us-east-1') | from_json }}"

    - name: Show username
      ansible.builtin.debug:
        msg: "ec2-user: {{ creds.ansible_user }}"
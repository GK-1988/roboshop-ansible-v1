---
- name: fetch screts from aws console secrets manager
  hosts: local
  connection: local
  tasks:
    - name: Fetching secrets from AWS console secrets manager
      debug:
        msg: "{{ lookup('amazon.aws.aws_secret', 'roboshop/dev/ansible', region='us-east-1') | from_json | json_query('ansible_user')  }}"
      amazon.aws.aws_secret:
        name: roboshop/dev/ansible
        region: us-east-1
      register: secrets

    
      
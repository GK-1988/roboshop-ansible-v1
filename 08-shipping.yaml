---
- name: configuring shipping server
  hosts: shipping
  become: yes

  tasks:
    - name: enable maven 3.9
      command: dnf module enable maven:3.9 -y

    - name: install maven and java25
      dnf:
        name: 
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25 #instaling this, so that we no need to set JAV_HOME again
        state: present

    - name: create roboshop system user
      user:
        name: roboshop
        system: true
        shell: /sbin/nologin
        create_home: false
        home: /app
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove shipping.zip
      file:
        path: /tmp/shipping.zip
        state: absent

    - name:  create app directory
      file:
        path: /app
        state: directory

    - name: download shipping application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-{{ app_version }}.zip
        dest: /tmp/shipping.zip

    - name: unzip the shipping receipe
      unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: mvn version without JAVA_HOME
      command: mvn --version
      args:
        chdir: /app
      register: mvn_default


    - name: print mvn version without JAVA_HOME
      debug:
        msg: "{{ mvn_default.stdout_lines }}"
        

    - name: install mvn dependencies
      ansible.builtin.command: mvn clean package
      args:
        chdir: /app

    - name: check generated file
      shell: ls -ltr /app/target
      register: output
    - debug:
        var: output.stdout_lines

    - name: rename jar file
      copy:
        src: /app/target/shipping.jar
        dest: /app/shipping.jar
        remote_src: yes 
      

    - name: copy shipping service file
      ansible.builtin.template:
        src: shipping.service.j2
        dest: /etc/systemd/system/shipping.service

    - name: reload the daemon
      systemd_service:
        daemon_reload: true

    - name: Install Mysql Clinet
      ansible.builtin.dnf:
        name: mysql
        state: present

    - name: Load shipping schema
      ansible.builtin.shell:
        mysql -h {{ mysql_host }} -uroot -p{{ mysql_root_password }} < /app/schema/shipping.sql
      register: schema_load
      changed_when: schema_load.rc == 0

    - name: start and enable shipping service
      systemd_service:
        name: shipping
        state: restarted
        enabled: yes




















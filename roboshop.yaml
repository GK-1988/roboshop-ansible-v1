---
# ============================================================================
# Playbook: roboshop-ec2-route53.yaml
#
# Purpose:
#   1. Create EC2 instances for Roboshop components
#   2. Create Route53 DNS records pointing to those instances
#   3. Delete DNS records and EC2 instances when required
#
# Examples:
#
# Create all components
# ansible-playbook roboshop-ec2-route53.yaml
#
# Create specific components
# ansible-playbook roboshop-ec2-route53.yaml \
#   -e "instances=['mongodb','redis']"
#
# Delete all resources
# ansible-playbook roboshop-ec2-route53.yaml \
#   -e "action=delete"
#
# ============================================================================
- name: Manage Roboshop Infrasturce 
  hosts: local
  connection: local
  gather_facts: false

  vars:
  #Action can be:
  #create
  #delete
    action: create
  #componenets to manage:
    instances:
      - mongodb
      - redis      
  #AWS image
    ami_id: ami-0055977a6e828a4f4
  #Route53 Hosted Zone
    domain_name: opsify.online
  #AWS Region
    aws_region: us-east-1
#EC2 Instance Size
    instance_type: t3.micro

  tasks:
    # TASK-1 -Create EC2 Instance
      - name: create EC2 Instances
        amazon.aws.ec2_instance:
          name: "roboshop-{{ item }}"
          image_id: "{{ ami_id }}"
          instance_type: "{{ instance_type }}"

          security_groups:
            - roboshop-common
            - roboshop-{{ item }}

          region: "{{ aws_region }}"
        loop: "{{ instances }}"
        when: action == "create"
        register: ec2_output
# Debug task for better understand
      # - name: Display EC2 instance Creation output
      #    debug:
      #      var: "ec2_output"
      #   when: action == "create"   

# Create Route53 DNS Records
      - name: Create Route53 DNS records
        amazon.aws.route53:
          state: present
          zone: "{{ domain_name }}"
          record: "{{ item.item }}.{{ domain_name }}"
          type: A
          ttl: 1
          value: "{{ item.instances[0].private_ip_address }}"
          overwrite: true
        loop: "{{ ec2_output.results }}"
        when: action == "create"
# Delete Route53 Records
      - name: Delete Route53 Records
        amazon.aws.route53:
          state: absent
          zone: "{{ domain_name }}"
          record: "{{ item }}.{{ domain_name }}"
          type: A
          ttl: 1
        loop: "{{ instances }}"
        when: action == "delete"


      












  
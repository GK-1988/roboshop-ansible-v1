---
- name: configuring cart server
  hosts: cart
  become: yes

  tasks:
    - name: disable default nodejs
      command: dnf module disable nodejs -y

    - name: enabled nodejs 24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs 
      dnf:
        name: nodejs
        state: present

    - name: create roboshop system user
      user:
        name: roboshop
        system: true
        shell: /sbin/nologin
        create_home: false
        home: /app
        state: present
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove cart.zip
      file:
        path: /tmp/cart.zip
        state: absent

    - name:  create app directory
      file:
        path: /app
        state: directory

    - name: download cart application
      get_url:
        url: https://raw.githubcartcontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{ app_version }}.zip
        dest: /tmp/cart.zip

    - name: unzip the cart receipe
      unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes

    - name: install dependencies
      community.general.npm:
        path: /app

    - name: copy cart service
      ansible.builtin.template:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service

    - name: reload the daemon
      systemd_service:
        daemon_reload: true

    - name: start and enable cart
      service:
        name: cart
        state: restarted
        enabled: yes




















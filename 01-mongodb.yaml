---
- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
    - name: copy mongo repo
      copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
        
    - name: Install mongodb server  
      package:
        name: mongodb-org
        state: present

    - name: start and enable mongod service
      service:
        name: mongod
        state: started
        enabled: yes
